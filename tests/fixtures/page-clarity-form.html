<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AURA Page Clarity Form Fixture</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 32px;
        color: rgb(31, 41, 55);
      }

      main {
        max-width: 640px;
      }

      form {
        display: grid;
        gap: 14px;
        border: 1px solid rgb(229, 231, 235);
        border-radius: 4px;
        padding: 18px;
      }

      label {
        display: grid;
        gap: 6px;
        text-decoration-line: none;
        background-color: transparent;
      }

      input,
      textarea {
        border: 1px solid rgb(156, 163, 175);
        border-radius: 4px;
        padding: 8px 10px;
        outline-style: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Account request</h1>
      <form aria-label="Account request form">
        <label>
          Full name
          <input id="clarity-form-input" name="name" autocomplete="name" />
        </label>
        <label>
          Email
          <input name="email" type="email" autocomplete="email" />
        </label>
        <label>
          Request details
          <textarea name="details" rows="4"></textarea>
        </label>
        <button type="submit">Submit request</button>
      </form>
    </main>
  </body>
</html>
